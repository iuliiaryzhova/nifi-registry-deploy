apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        # 1) Скачать JDBC драйвер PostgreSQL
        - name: download-jdbc
          image: curlimages/curl:8.6.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /opt/nifi-registry/nifi-registry-current/lib/ext
              for i in 1 2 3 4 5; do
                curl -fL "{{ .Values.jdbc.driverUrl }}" \
                  -o /opt/nifi-registry/nifi-registry-current/lib/ext/postgresql.jar && exit 0
                echo "curl failed, retry $i/5"
                sleep 5
              done
              exit 1
          volumeMounts:
            - name: registry-lib-ext
              mountPath: /opt/nifi-registry/nifi-registry-current/lib/ext

        # 2) Сгенерировать nifi-registry.properties из postgres-secret
        - name: render-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /conf
              cat > /conf/nifi-registry.properties <<EOF
              # --- Web ---
              # (пишем host=0.0.0.0, но на port-forward всё равно влияет sidecar ниже)
              nifi.registry.web.http.host=0.0.0.0
              nifi.registry.web.http.port={{ .Values.service.port }}

              # --- DB (PostgreSQL) ---
              nifi.registry.db.url=jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/${POSTGRES_DB}
              nifi.registry.db.driver.class={{ .Values.jdbc.driverClass }}
              nifi.registry.db.driver.directory=./lib/ext
              nifi.registry.db.username=${POSTGRES_USER}
              nifi.registry.db.password=${POSTGRES_PASSWORD}

              nifi.registry.extension.dir=./extensions
              EOF
          volumeMounts:
            - name: registry-conf
              mountPath: /conf

      containers:
        # Основной контейнер NiFi Registry
        - name: nifi-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            # Фиксируем heap, чтобы не ловить 137/падения по памяти на minikube
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx1024m"
          command:
            - sh
            - -c
            - |
              set -e
              # Подменяем конфиг тем, что сгенерил initContainer
              cp /conf/nifi-registry.properties /opt/nifi-registry/nifi-registry-current/conf/nifi-registry.properties

              # Старт
              /opt/nifi-registry/nifi-registry-current/bin/nifi-registry.sh start

              # Держим контейнер (и видим логи в kubectl logs)
              tail -F /opt/nifi-registry/nifi-registry-current/logs/nifi-registry-app.log
          volumeMounts:
            - name: registry-lib-ext
              mountPath: /opt/nifi-registry/nifi-registry-current/lib/ext
            - name: registry-conf
              mountPath: /conf

        # Sidecar: делает локальный loopback listener для kubectl port-forward
        # kubectl port-forward внутри pod пытается подключиться к 127.0.0.1:18080
        # а NiFi Registry у тебя слушает на podIP -> поэтому добавляем прокси
        - name: loopback-proxy
          image: alpine/socat:1.8.0.3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -e
              socat -d -d TCP4-LISTEN:{{ .Values.service.port }},bind=127.0.0.1,fork,reuseaddr TCP4:${POD_IP}:{{ .Values.service.port }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: registry-lib-ext
          emptyDir: {}
        - name: registry-conf
          emptyDir: {}
