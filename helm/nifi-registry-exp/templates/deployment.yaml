apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi-registry
  template:
    metadata:
      labels:
        app: nifi-registry
    spec:
      initContainers:
        - name: download-jdbc
          image: curlimages/curl:8.6.0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /jdbc
              curl -L "{{ .Values.jdbc.driverUrl }}" -o /jdbc/postgresql.jar
          volumeMounts:
            - name: jdbc
              mountPath: /jdbc

        - name: render-config
          image: busybox:1.36
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }}
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /conf
              cat > /conf/nifi-registry.properties <<EOF
              nifi.registry.web.http.port={{ .Values.service.port }}

              nifi.registry.db.url=jdbc:postgresql://{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/${POSTGRES_DB}
              nifi.registry.db.driver.class={{ .Values.jdbc.driverClass }}
              nifi.registry.db.driver.directory=./jdbc
              nifi.registry.db.username=${POSTGRES_USER}
              nifi.registry.db.password=${POSTGRES_PASSWORD}

              nifi.registry.extension.dir=./extensions
              EOF
          volumeMounts:
            - name: conf
              mountPath: /conf

      containers:
        - name: nifi-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: jdbc
              mountPath: /opt/nifi-registry/jdbc
            - name: conf
              mountPath: /opt/nifi-registry/nifi-registry.properties
              subPath: nifi-registry.properties

      volumes:
        - name: jdbc
          emptyDir: {}
        - name: conf
          emptyDir: {}
